<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gravity sandbox: self-test</title>
  <style>
    body { background: #05060a; color: #cfd8ff; font-family: sans-serif; padding: 24px; }
    h1 { margin-top: 0; }
    #summary { font-size: 18px; margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    td, th { padding: 8px 12px; border-bottom: 1px solid rgba(120,150,255,0.2); text-align: left; }
    .pass { color: #6bff8a; font-weight: bold; }
    .fail { color: #ff6b6b; font-weight: bold; }
    button { margin-top: 16px; padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Self-test</h1>
  <div id="summary">Running…</div>
  <table id="results"></table>
  <button id="rerun">Run again</button>
  <script type="module" src="/js/test.js"></script>
</body>
</html>
