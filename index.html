<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Gravity Sandbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="toolbar">
    <div class="btn-row">
      <button id="btn-play">Pause</button>
      <button id="btn-step">Step</button>
      <button id="btn-restart">Restart</button>
    </div>

    <label>
      Speed: <span id="speed-val">0.50 yr/s</span>
      <input id="speed" type="range" min="-2" max="2" step="0.01" value="-0.301">
    </label>

    <label>
      Integrator:
      <select id="method">
        <option value="verlet">Verlet (symplectic)</option>
        <option value="rk4">RK4</option>
        <option value="euler">Euler (bad)</option>
      </select>
    </label>

    <label>
      Inclination: <span id="incl-val">0°</span>
      <input id="incl" type="range" min="-90" max="90" step="1" value="0">
    </label>

    <div class="btn-row">
      <button id="btn-top">Top-down</button>
      <button id="btn-side">Side view</button>
      <button id="btn-reset">Reset</button>
      <button id="btn-ortho">Perspective</button>
    </div>

    <div class="hint">
      Left-drag: launch · Click body: select<br>
      Right-drag: rotate · Shift+drag or middle-drag: pan<br>
      Scroll: zoom · Space: pause
    </div>
  </div>

  <div id="info" hidden></div>

  <div id="cons"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
