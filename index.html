<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Gravity Sandbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="toolbar">
    <div class="btn-row">
      <button id="btn-play">Pause</button>
      <button id="btn-step">Step</button>
      <button id="btn-restart">Restart</button>
      <button id="btn-rev">Reverse</button>
    </div>

    <label>
      Speed: <span id="speed-val">0.50 yr/s</span>
      <input id="speed" type="range" min="-2" max="2" step="0.01" value="-0.301">
    </label>

    <label>
      Scenario:
      <select id="preset">
        <option value="earth">Sun + Earth</option>
        <option value="solar">Inner solar system</option>
        <option value="inclined">Inclined orbits</option>
        <option value="polar">Polar orbit</option>
        <option value="binary">Binary star + planet</option>
        <option value="figure8">Figure-eight (3 stars)</option>
        <option value="earthmoon">Earth + Moon (true scale)</option>
        <option value="moons">Moons: prograde, polar, retrograde</option>
        <option value="trojans">Sun–Jupiter + trojans</option>
        <option value="kozai">Kozai–Lidov oscillation</option>
        <option value="belt">Inclined asteroid belt</option>
        <option value="flyby">Hyperbolic flyby</option>
        <option value="chaos">Chaotic three-body</option>
        <option value="empty">Empty space + one star</option>
      </select>
    </label>

    <label class="check">
      <input id="adaptive" type="checkbox" checked> Adaptive timestep
    </label>

    <label>
      Integrator:
      <select id="method">
        <option value="verlet">Verlet (symplectic)</option>
        <option value="rk4">RK4</option>
        <option value="euler">Euler (bad)</option>
      </select>
    </label>

    <label>
      Launch body:
      <select id="body-type">
        <option value="star">Sun-like star</option>
        <option value="reddwarf">Red dwarf</option>
        <option value="giant">Gas giant</option>
        <option value="rocky" selected>Rocky planet</option>
        <option value="moon">Moon</option>
        <option value="asteroid">Asteroid</option>
        <option value="comet">Comet</option>
        <option value="custom">Custom</option>
      </select>
    </label>

    <label>
      Mass: <span id="mass-val"></span>
      <input id="mass" type="range" min="-17" max="1.5" step="0.01" value="-5.52">
    </label>

    <label>
      Inclination: <span id="incl-val">0°</span>
      <input id="incl" type="range" min="-90" max="90" step="1" value="0">
    </label>

    <label>
      Launch height: <span id="height-val">0.00 AU</span>
      <input id="height" type="range" min="-3" max="3" step="0.05" value="0">
    </label>

    <label>
      Launch strength: <span id="gain-val">×4.0</span>
      <input id="gain" type="range" min="0" max="4" step="0.01" value="0.6">
    </label>

    <div class="btn-row">
      <button id="btn-zero">Zero momentum</button>
    </div>
    <label class="check">
      <input id="autozero" type="checkbox" checked> Auto-zero on launch
    </label>

    <div class="btn-row">
      <button id="btn-top">Top-down</button>
      <button id="btn-side">Side view</button>
      <button id="btn-reset">Reset</button>
      <button id="btn-ortho">Perspective</button>
      <button id="btn-scale">Visual scale</button>
      <button id="btn-follow">Follow selected</button>
    </div>

    <div class="hint" id="scale-note">Sizes exaggerated · merges at 30× radius</div>

    <div class="hint">
      Left-drag: launch · Click body: select<br>
      Right-drag: rotate · Shift+drag or middle-drag: pan<br>
      Scroll: zoom · Space: pause
    </div>
  </div>

  <div id="info" hidden></div>
  <div id="cons"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
