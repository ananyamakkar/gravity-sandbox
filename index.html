<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Gravity Sandbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="toolbar">
    <label>
      Inclination: <span id="incl-val">0°</span>
      <input id="incl" type="range" min="-90" max="90" step="1" value="0">
    </label>

    <div class="btn-row">
      <button id="btn-top">Top-down</button>
      <button id="btn-side">Side view</button>
      <button id="btn-reset">Reset</button>
      <button id="btn-ortho">Perspective</button>
    </div>

    <div class="hint">
      Left-drag: launch · Right-drag: rotate<br>
      Shift+drag or middle-drag: pan · Scroll: zoom
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
